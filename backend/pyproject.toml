[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-monitoring-backend"
version = "0.1.0"
description = "Digital Product Rental Monitoring System — Modular Monolith Backend & Telegram Bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "aiogram>=3.13.0,<4.0.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.1.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
